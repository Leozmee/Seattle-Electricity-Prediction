[project]
name = "seattle-energy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DorotheeCatry", email = "catrydorothee@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
seattle-energy = "seattle_energy:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.17.5",
]
